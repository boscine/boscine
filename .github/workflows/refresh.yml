name: refresh stats

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:          # deliberately NO `push` trigger — this job commits,
                              # and a push trigger would re-run it on its own commit

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies for portrait generator
        run: |
          pip install pillow numpy opencv-python-headless rembg onnxruntime

      - name: Generate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: |
          python3 scripts/generate_stats.py
          python3 scripts/generate_portrait.py --output portrait.svg

      - name: Commit and push changes if updated
        run: |
          FILES="stats.svg streak.svg langs.svg year.svg portrait.svg"
          [ -z "$(git status --porcelain -- $FILES)" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh graphics"
          git push
